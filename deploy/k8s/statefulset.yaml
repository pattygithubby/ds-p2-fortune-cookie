# Pods are numbered from 1 (ordinals.start), so pod bully-N is Bully node N:
# bully-1, bully-2, bully-3 are nodes 1, 2, 3. BULLY_ID is set from the pod-index label
# rather than left to the bully library, which would read the host name as ordinal + 1.
# Needs Kubernetes 1.28+ (start ordinals and the pod-index label are on by default).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bully
spec:
  serviceName: bully
  replicas: 3
  ordinals:
    start: 1              # pods bully-1 .. bully-3 instead of bully-0 .. bully-2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: fortune-cookie
  template:
    metadata:
      labels:
        app: fortune-cookie
    spec:
      containers:
        - name: fortune
          image: fortune-cookie
          imagePullPolicy: IfNotPresent
          env:
            - name: WEB_PORT
              value: "8080"
            - name: BULLY_ALGORITHM
              value: improved
            - name: BULLY_ID      # 1, 2, 3: the N in the pod name bully-N
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: BULLY_N
              value: "3"          # must equal replicas
            - name: BULLY_PEERS     # node N is reached at bully-N.bully:9000
              value: "bully-{id}.bully:9000"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: election
              containerPort: 9000
              protocol: UDP
          # Restart a pod whose web server stops answering.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          # /leader is 200 only on the leader, so only the leader is Ready and the
          # fortune-web Service sends all traffic to it. Followers stay unready (and
          # stay reachable for the election through publishNotReadyAddresses).
          # Note: a rolling update waits for each pod to become Ready, so it stalls at
          # the first follower. Redeploy with `kubectl delete pod -l app=fortune-cookie`.
          readinessProbe:
            httpGet: {path: /leader, port: http}
            periodSeconds: 1
            failureThreshold: 1   # drop a pod that lost leadership after one failed probe
          volumeMounts:
            - name: state
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Mi
